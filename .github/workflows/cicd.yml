name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
      - 'requirements.txt'
      - 'tests/**.py'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Pull data with DVC
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          dvc remote add --force -d labstore "s3://${ARTIFACT_BUCKET}/dvc"
          dvc remote modify labstore region "$AWS_DEFAULT_REGION"
          dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          f1=$(python -c "import json; print(json.load(open('outputs/report.json'))['f1_score'])")
          echo "f1=${f1}" >> "$GITHUB_OUTPUT"

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json

      - name: Save trained model as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/model.joblib

  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        env:
          F1_SCORE: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import os

          f1 = float(os.environ["F1_SCORE"])
          if f1 < 0.65:
              raise SystemExit(
                  f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai."
              )
          print(f"PASSED: f1_score {f1:.4f}; dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload model to Amazon S3
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws s3 cp models/model.joblib \
            "s3://${ARTIFACT_BUCKET}/artifacts/current/model.joblib"

      - name: Restart API and verify health through Systems Manager
        env:
          INSTANCE_ID: ${{ secrets.SERVER_INSTANCE_ID }}
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["sudo systemctl restart income-api; for attempt in $(seq 1 12); do if curl -fsS http://localhost:8080/healthz; then exit 0; fi; sleep 5; done; sudo journalctl -u income-api -n 50 --no-pager; exit 1"]}' \
            --query "Command.CommandId" \
            --output text)
          echo "SSM command: ${command_id}"

          for attempt in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)
            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text || true
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for the SSM deployment command."
          exit 1
